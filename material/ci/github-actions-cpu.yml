# CPU CI template for the chipcae material point library.
# NOT wired into .github/workflows (RULES: main CI is owner-gated).
name: material-cpu

on:
  workflow_dispatch:
  push:
    paths:
      - "material/**"

jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libomp-dev git
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100

      - name: Configure (fetch Kokkos Serial+OpenMP)
        run: |
          cmake -S material -B material/build-cpu -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIPCAE_MATERIAL_FETCH_KOKKOS=ON \
            -DCHIPCAE_MATERIAL_ENABLE_PYTHON=OFF \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON

      - name: Build
        run: cmake --build material/build-cpu -j

      - name: Test
        run: ctest --test-dir material/build-cpu --output-on-failure
