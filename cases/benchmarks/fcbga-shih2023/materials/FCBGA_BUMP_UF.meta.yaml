    note: 端点算例为无松弛（E(t) ≡ E0）与完全松弛（E(t) ≡ E∞）两档弹性极限，与借用形状（s = 1）一起报告；不声明结构响应必然落在两者之间
  prony_shape_scale_s:
    range: [0.0, 1.0]
    status: agreed  # 连续介质求解器组核定（2026-11-17）
    definition: "E_i(s) = s·E_i，τ_i 不变；E∞(s) = E0 − s(E0 − E∞_ref)；E∞(s) + ΣE_i(s) = E0；s = 0 ⇔ E ≡ E0"
    generator: "tools/vv/prony_scale.py（加载前生成合法 Schema v1 卡；s 不是运行时字段）"
    report_endpoints: ["s = 1（借用形状）", "s = 0（E ≡ E0）", "E ≡ E∞_ref"]
    note: 中间 s 只作扫描，不是默认本构；constant_poisson_from_E 为近似
  p_shih2023_note: "P-SHIH2023 不按 Kim 2016 组分重推本层；改用 Shih 2023 Fig.12「Equivalent material (Underfill+Solder bump)」曲线数字化（tbd）。数字化前本卡 E0/E∞ 只作借用灵敏度端点"
