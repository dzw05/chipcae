schema: chipcae.case/1.0
stack:
  ref: fcbga_demo.stack.json
materials:
  ref: fcbga_demo.materials.json
mesh:
  type: aligned_cartesian_cut
  cut:
    stabilization: ghost_penalty
physics:
  - id: mech
    solver: fem.solid
    temp_from: thermal
loads:
  - type: uniform_temperature
    T_ref: 298.15
    T_target: 398.15
constraints:
  rigid: 3-2-1
output:
  format: vtkhdf
  warpage:
    standard: JESD22-B112
    remove_rigid: best_fit_plane
