# Reusable workflow. Called from ci.yml only. Do not add pull_request/push triggers.
name: Mesh

on:
  workflow_call:

concurrency:
  group: mesh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mesh-tests:
    name: Mesh tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || vars.TIER_A_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake ccache ninja-build
          ccache --version

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gcc-release-${{ hashFiles('schema/**', 'mesh/**', 'tests/integration/mesh_p1/**', '**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ccache-gcc-release-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 200M
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCHIPCAE_WARNINGS_AS_ERRORS=ON \
            -DCHIPCAE_ENABLE_ECAD=ON \
            -DCHIPCAE_MATERIAL_FETCH_KOKKOS=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_Clipper2=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE

      - name: third_party_notices_check (tierA)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          allowlist = {line.split('#', 1)[0].strip().lower() for line in (root / 'cmake/dependencies.allowlist').read_text().splitlines() if line.split('#', 1)[0].strip()}
          notices = (root / 'THIRD_PARTY_NOTICES').read_text().lower()
          pattern = re.compile(r'(?:find_package|fetchcontent_declare)\s*\(\s*([a-z0-9_.-]+)', re.I)
          refs = set()
          for path in root.joinpath('cmake').rglob('*.cmake'):
              refs.update(name.lower() for name in pattern.findall(path.read_text()))
          refs = {'python' if name == 'python3' else name for name in refs}
          missing_allowlist = sorted(ref for ref in refs if ref not in allowlist)
          missing_notice = sorted(ref for ref in refs if not re.search(r'\|\s*' + re.escape(ref) + r'\s*\|', notices))
          if missing_allowlist or missing_notice:
              raise SystemExit(f'missing allowlist entries={missing_allowlist}; missing notice entries={missing_notice}')
          print(f'Checked {len(refs)} CMake dependencies against allowlist and THIRD_PARTY_NOTICES')
          PY

      - name: Build mesh test targets
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 200M
        run: |
          set -euo pipefail
          # Build every registered Tier A mesh test plus the import-threshold and repair-policy tests.
          cmake --build build --target chipcae_test_ipc2581_e11 chipcae_test_copper_map k1_background k1_cut k1_cut_stats k1_mesh_digest chipcae_test_import_thresholds chipcae_test_repair_policy --parallel
          ccache --show-stats

      - name: Run mesh tests
        run: |
          set -euo pipefail
          ctest --test-dir build -L mesh --output-on-failure --timeout 60

  gpu-nightly-hook:
    name: GPU nightly hook (disabled)
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run GPU hook
        run: bash tests/integration/mesh_p1/nightly/run_gpu.sh
