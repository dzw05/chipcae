name: Measure hosted nightly

# One-shot measurement of the nightly clang build and the CUDA compile.
# Deleted after docs/ci.md records the hosted minutes. Not a required check.
# Do not add this trigger back: CUDA and the extra compiler stay on the
# nightly schedule only.

on:
  pull_request:

concurrency:
  group: measure-nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  clang-extra:
    name: Nightly clang build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang and ccache
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang g++ cmake ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-clang-release-${{ hashFiles('**/*.cpp', '**/*.hpp', '**/*.h', '**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ccache-clang-release-

      - name: Configure, build, test
        env:
          CCACHE_DIR: ~/.cache/ccache
          CCACHE_MAXSIZE: 200M
        run: |
          set -euo pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure --output-junit "$PWD/build/junit.xml"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: measure-clang-junit-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: build/junit.xml

  cuda-compile:
    name: Nightly CUDA compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile smoke translation unit
        run: |
          set -euo pipefail
          if ! command -v nvcc >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nvidia-cuda-toolkit
          fi
          nvcc -c bench/cuda/smoke.cu -o "$RUNNER_TEMP/chipcae_cuda_smoke.o"
          echo "nvcc compiled bench/cuda/smoke.cu. The object was not linked or executed."

  usage-skip:
    name: Hosted minutes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check account minutes
        env:
          ACTIONS_BILLING_TOKEN: ${{ secrets.ACTIONS_BILLING_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTIONS_MINUTE_BUDGET: ${{ vars.ACTIONS_MINUTE_BUDGET || '1500' }}
          ACTIONS_USAGE_ALERT_FRACTION: ${{ vars.ACTIONS_USAGE_ALERT_FRACTION || '0.8' }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/check_actions_usage.py
