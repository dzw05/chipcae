name: CI

# Hosted Tier A. Linux only.
# Pull requests run lint plus one Release build. Pushes to main also run the
# build when they change code. Docs-only pushes skip builds via lint outputs.
# Draft pull requests run lint (and ci-ok); build-test waits until the PR is marked ready.
# Docs-only pull requests skip the build.
# Build-and-test can move later by setting the TIER_A_RUNNER repository variable
# to a single runner label. Leave it unset to stay on ubuntu-latest.
# The only hard merge gate is the aggregate job "CI / ci-ok" (ADR-0006).
# Branch protection is not enabled and must not be turned on. See docs/ci.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# Kokkos install pin (4.x). The only place this version is set for CI.
# "4.7.01" is the GitHub tag for the 4.7.1 release (CMake reports 4.7.1).
env:
  KOKKOS_VERSION: "4.7.01"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      code: ${{ steps.paths.outputs.code }}
      mesh: ${{ steps.paths.outputs.mesh }}
      desktop: ${{ steps.paths.outputs.desktop }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch protocol baseline
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            echo "CHIPCAE_PROTOCOL_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
            echo "CHIPCAE_PROTOCOL_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-clang-format-23.1.5

      - name: Install lint tools
        run: |
          set -euo pipefail
          python3 -m pip install --user --break-system-packages --disable-pip-version-check \
            'clang-format==23.1.5' pyyaml jsonschema
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: License policy
        run: python3 cmake/check_license_policy.py .

      - name: Format
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' '*.cu')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources to format"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

      - name: YAML and config
        run: python3 tools/ci/check_configs.py .

      - name: Protocol compatibility
        run: python3 cmake/check_protocol_compat.py .

      - name: Baseline update label
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_BASELINE_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'perf-baseline-update') }}
        run: python3 tools/ci/check_baseline_label.py .

      - name: Python unit tests
        run: python3 -m unittest discover -s tools -t . -p 'test_*.py' -v

      - name: Paths
        id: paths
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base" || true
            fi
            if git diff --name-only "$base"...HEAD > /tmp/chipcae-changed 2>/dev/null; then
              :
            elif git diff --name-only "$base" HEAD > /tmp/chipcae-changed 2>/dev/null; then
              :
            else
              echo "desktop=true" >> "$GITHUB_OUTPUT"
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "mesh=true" >> "$GITHUB_OUTPUT"
              echo "could not diff against the base; running the build"
              exit 0
            fi
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              echo "desktop=true" >> "$GITHUB_OUTPUT"
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "mesh=false" >> "$GITHUB_OUTPUT"
              echo "push has no usable before SHA; running the build"
              exit 0
            fi
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$before" || true
            fi
            if ! git diff --name-only "$before".."${{ github.sha }}" > /tmp/chipcae-changed 2>/dev/null; then
              echo "desktop=true" >> "$GITHUB_OUTPUT"
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "mesh=false" >> "$GITHUB_OUTPUT"
              echo "could not diff against github.event.before; running the build"
              exit 0
            fi
          fi
          code=false
          mesh=false
          desktop=false
          if [ ! -s /tmp/chipcae-changed ]; then
            echo "desktop=false" >> "$GITHUB_OUTPUT"
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "mesh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # material/ and tests/material/ are code and must trigger build-test.
            case "$file" in
              docs/*|*.md|LICENSE|CODEOWNERS)
                ;;
              material/*|tests/material/*)
                code=true
                ;;
              *)
                code=true
                ;;
            esac
            case "$file" in
              schema/*|mesh/*|geometry/*|tests/integration/mesh_p1/*|tests/unit/test_import_thresholds*|tests/unit/test_repair_policy.cpp)
                mesh=true
                ;;
            esac
            case "$file" in
              desktop/*|schema/*|material/schema/*|protocol/*|.github/workflows/ci.yml)
                desktop=true
                ;;
            esac
          done < /tmp/chipcae-changed
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "mesh=$mesh" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"
          echo "non-doc changes: $code"
          echo "mesh changes: $mesh"

  build-test:
    name: Build and test
    needs: lint
    if: |
      (github.event_name == 'push' || github.event.pull_request.draft == false) &&
      needs.lint.result == 'success' &&
      needs.lint.outputs.code == 'true'
    runs-on: ${{ vars.TIER_A_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build ccache python3-yaml python3-numpy python3-scipy libhdf5-dev
          ccache --version
          g++ --version
          cmake --version

      - name: Install jsoncons for preview golden hashes
        run: |
          set -euo pipefail
          source tests/integration/mesh_p1/ci/deps.lock
          curl -fsSL "$JSONCONS_URL" -o "$RUNNER_TEMP/jsoncons.tar.gz"
          mkdir -p "$RUNNER_TEMP/jsoncons"
          tar -xzf "$RUNNER_TEMP/jsoncons.tar.gz" -C "$RUNNER_TEMP/jsoncons" --strip-components=1
          cmake -S "$RUNNER_TEMP/jsoncons" -B "$RUNNER_TEMP/jsoncons-build" \
            -DJSONCONS_BUILD_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$HOME/deps/jsoncons"
          cmake --install "$RUNNER_TEMP/jsoncons-build"

      - name: Kokkos cache identity
        id: kokkos-key
        run: |
          set -euo pipefail
          prefix="$HOME/deps/kokkos"
          mkdir -p "$HOME/deps"
          key="kokkos-${KOKKOS_VERSION}-${RUNNER_OS}-${ImageOS:-unknown}-gcc$(gcc -dumpversion)-serial-openmp-Release"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "path=$prefix" >> "$GITHUB_OUTPUT"
          echo "Kokkos cache key: $key"

      - name: Cache Kokkos
        id: cache-kokkos
        uses: actions/cache@v4
        with:
          path: ${{ steps.kokkos-key.outputs.path }}
          key: ${{ steps.kokkos-key.outputs.key }}

      - name: Build Kokkos
        if: steps.cache-kokkos.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/kokkos-src"
          build="$RUNNER_TEMP/kokkos-build"
          curl -fsSL "https://github.com/kokkos/kokkos/archive/refs/tags/${KOKKOS_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/kokkos.tar.gz"
          mkdir -p "$src" "$HOME/deps"
          tar -xzf "$RUNNER_TEMP/kokkos.tar.gz" -C "$src" --strip-components=1
          cmake -S "$src" -B "$build" -G Ninja \
            -DCMAKE_INSTALL_PREFIX="$HOME/deps/kokkos" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=20 \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=ON \
            -DKokkos_ENABLE_CUDA=OFF \
            -DKokkos_ENABLE_TESTS=OFF \
            -DKokkos_ENABLE_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build "$build" --parallel
          cmake --install "$build"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-gcc-release-${{ hashFiles('**/*.cpp', '**/*.hpp', '**/*.h', '**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ccache-gcc-release-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 200M
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache --zero-stats
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCHIPCAE_WARNINGS_AS_ERRORS=ON \
            -DKokkos_ROOT="$HOME/deps/kokkos" \
            -DCHIPCAE_REQUIRE_KOKKOS=ON \
            -DCHIPCAE_ENABLE_KOKKOS=ON \
            -DCHIPCAE_MATERIAL_ENABLE_PYTHON=OFF \
            -DCHIPCAE_ENABLE_HDF5=ON -DCHIPCAE_ENABLE_JSONCONS=ON \
            -Djsoncons_ROOT="$HOME/deps/jsoncons"

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 200M
        run: |
          set -euo pipefail
          cmake --build build --parallel
          ccache --show-stats

      - name: Test
        env:
          OMP_NUM_THREADS: 2
          OMP_PROC_BIND: "false"
        run: |
          set -euo pipefail
          ctest --test-dir build --output-on-failure --output-junit "$PWD/build/junit.xml"

      - name: Perf microbenchmark (informational timing)
        id: perf
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          RUNNER_LABEL: ${{ vars.TIER_A_RUNNER || 'ubuntu-latest' }}
        run: |
          set -euo pipefail
          make -C bench
          python3 tools/perf/harness.py \
            --config bench/perf_config.yaml \
            --binary bench/poisson_microbench \
            --kind microbenchmark \
            --grid 48 \
            --runner-label "$RUNNER_LABEL" \
            --build-config gcc-release \
            --output build/perf-summary.json
          python3 tools/perf/compare_baseline.py \
            --config bench/perf_config.yaml \
            --summary build/perf-summary.json \
            --baseline bench/baselines/poisson_microbenchmark_gcc-release.json \
            --profile per-commit \
            --tier a \
            --output build/perf-compare.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Record an inconclusive perf run
        if: steps.perf.outputs.inconclusive == 'true'
        run: |
          {
            echo "### Perf noise"
            echo "inconclusive=true. Timing was too noisy to gate (CV still above 5% after one rerun)."
            echo "Hosted pull requests do not open an issue for this flag."
            echo "The Tier B nightly perf job is the step that should open one. See docs/ci.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-a-results-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build/junit.xml
            build/perf-summary.json
            build/perf-compare.json

  mesh:
    name: Mesh
    needs: lint
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      needs.lint.result == 'success' &&
      needs.lint.outputs.mesh == 'true'
    uses: ./.github/workflows/mesh.yml
    permissions:
      contents: read

  desktop:
    name: Desktop
    needs: lint
    if: |
      (github.event_name == 'push' || github.event.pull_request.draft == false) &&
      needs.lint.result == 'success' &&
      needs.lint.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # runner.temp is not allowed in job-level env; steps use RUNNER_TEMP / runner.temp.
      CCACHE_DIR: ${{ github.workspace }}/.ccache-desktop
      CCACHE_MAXSIZE: 200M
      QT_QPA_PLATFORM: offscreen
      MAMBA_ROOT_PREFIX: ${{ github.workspace }}/.desktop-mamba
      DESKTOP_PREFIX: ${{ github.workspace }}/.desktop-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desktop source and cache identity
        id: sdk
        run: |
          set -euo pipefail
          mkdir -p build-desktop/logs
          exec > >(tee build-desktop/logs/sdk-identity.log) 2>&1
          lock=desktop/env/desktop-linux.lock.yml
          digest=missing-lock
          if [ -f "$lock" ]; then digest=$(sha256sum "$lock" | cut -d ' ' -f1); fi
          echo "key=desktop-v1-${RUNNER_OS}-${ImageOS:-unknown}-gcc$(g++ -dumpfullversion)-Qt6-VTK9.7-$digest" >> "$GITHUB_OUTPUT"
          if [ ! -f desktop/CMakeLists.txt ]; then
            echo "D01 desktop/CMakeLists.txt has not landed; temporarily skipping the desktop build."
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          test -s "$lock" || { echo "ERROR: D01 SDK lock is missing or empty: $lock"; exit 1; }

      # The lock hash covers the SDK compiler ABI and exact Qt/VTK builds.
      # Cache the extracted prefix first, with packages available for repair.
      - name: Cache desktop SDK
        if: steps.sdk.outputs.present == 'true'
        id: desktop-cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DESKTOP_PREFIX }}
            ${{ env.MAMBA_ROOT_PREFIX }}/pkgs
          key: ${{ steps.sdk.outputs.key }}

      - name: Cache desktop compiler outputs
        if: steps.sdk.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.sdk.outputs.key }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ steps.sdk.outputs.key }}-ccache-

      - name: Install locked prebuilt SDK
        if: steps.sdk.outputs.present == 'true'
        run: |
          set -euo pipefail
          exec > >(tee build-desktop/logs/sdk-install.log) 2>&1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache
          mkdir -p "$RUNNER_TEMP/desktop-bin"
          curl --fail --location --retry 3 https://micro.mamba.pm/api/micromamba/linux-64/2.0.5 \
            -o "$RUNNER_TEMP/desktop-micromamba.tar.bz2"
          tar -xjf "$RUNNER_TEMP/desktop-micromamba.tar.bz2" -C "$RUNNER_TEMP/desktop-bin" bin/micromamba
          echo "$RUNNER_TEMP/desktop-bin/bin" >> "$GITHUB_PATH"
          if [ ! -f "$DESKTOP_PREFIX/conda-meta/history" ]; then
            "$RUNNER_TEMP/desktop-bin/bin/micromamba" create --yes --prefix "$DESKTOP_PREFIX" \
              --file desktop/env/desktop-linux.lock.yml
          fi
          "$RUNNER_TEMP/desktop-bin/bin/micromamba" list --prefix "$DESKTOP_PREFIX"

      - name: Configure and build desktop
        if: steps.sdk.outputs.present == 'true'
        run: |
          set -euo pipefail
          exec > >(tee build-desktop/logs/configure-build.log) 2>&1
          micromamba run -p "$DESKTOP_PREFIX" cmake -S desktop -B build-desktop -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="$DESKTOP_PREFIX" -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          micromamba run -p "$DESKTOP_PREFIX" cmake --build build-desktop --parallel 2
          ccache --show-stats

      - name: Desktop tests and EGL capture
        if: steps.sdk.outputs.present == 'true'
        run: |
          set -euo pipefail
          exec > >(tee build-desktop/logs/ctest.log) 2>&1
          micromamba run -p "$DESKTOP_PREFIX" ctest --test-dir build-desktop \
            --no-tests=error --output-on-failure -E 'desktop_.*(render|capture|chart)' \
            --output-junit "$PWD/build-desktop/junit-desktop.xml"
          micromamba run -p "$DESKTOP_PREFIX" env -u DISPLAY \
            VTK_DEFAULT_OPENGL_WINDOW=vtkEGLRenderWindow \
            ctest --test-dir build-desktop --no-tests=error --output-on-failure \
            -R 'desktop_.*(render|capture|chart)' --output-junit "$PWD/build-desktop/junit-render.xml"

      - name: Upload desktop results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-results-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            build-desktop/junit*.xml
            build-desktop/**/*.png
            build-desktop/logs/
            build-desktop/CMakeCache.txt
            build-desktop/CMakeFiles/CMakeConfigureLog.yaml
            build-desktop/Testing/Temporary/

  ci-ok:
    if: always()
    needs: [lint, build-test, mesh, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check results
        env:
          LINT: ${{ needs.lint.result }}
          BUILD: ${{ needs.build-test.result }}
          MESH: ${{ needs.mesh.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$LINT" = success && { test "$BUILD" = success || test "$BUILD" = skipped; } && { test "$MESH" = success || test "$MESH" = skipped; } && { test "$DESKTOP" = success || test "$DESKTOP" = skipped; }
