name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.f.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            code: ['**/*.cpp','**/*.hpp','**/CMakeLists.txt','cmake/**','protocol/**','.github/**','tests/**']
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch protocol baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin +refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}
            echo "CHIPCAE_PROTOCOL_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin ${{ github.event.before }}
            echo "CHIPCAE_PROTOCOL_BASE=${{ github.event.before }}" >> "$GITHUB_ENV"
          fi
      - name: Install formatter
        run: pipx install clang-format==23.1.5 || python3 -m pip install --user --break-system-packages clang-format==23.1.5
      - name: License policy
        run: python3 cmake/check_license_policy.py .
      - name: Format
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx')
          if [ ${#files[@]} -gt 0 ]; then
            clang-format --dry-run --Werror "${files[@]}"
          fi
      - name: Protocol compatibility
        run: python3 cmake/check_protocol_compat.py .
  quick-check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get install -y --no-install-recommends ninja-build ccache || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ninja-build ccache
          }
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-gcc-release
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCHIPCAE_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
  ci-ok:
    if: always()
    needs: [changes, lint, quick-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          QUICK: ${{ needs.quick-check.result }}
        run: test "$CHANGES" = success && test "$LINT" = success && { test "$QUICK" = success || test "$QUICK" = skipped; }

  # TODO(later): enable a CUDA compile-only job (nvcc container, no GPU required)
  # once optional-dependency build configs land. It should configure/build with
  # Kokkos CUDA + MFEM device backends and not run tests.
