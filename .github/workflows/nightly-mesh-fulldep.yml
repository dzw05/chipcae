name: Nightly mesh full dependencies
on:
  schedule:
    - cron: '0 18 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: Force tests even when schema/mesh/deps are unchanged
        type: boolean
        default: true
      rebuild_deps:
        description: Discard the dependency prefix cache, rebuild, and replace the cache entry
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: nightly-mesh-fulldep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mesh-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OMPI_MCA_rmaps_base_oversubscribe: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache/restore@v4
        with:
          path: .k1-last-success
          key: k1-success-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            k1-success-${{ github.ref_name }}-

      - name: Check changes since this job last succeeded
        id: changes
        env:
          FORCE: ${{ inputs.force }}
          REBUILD_DEPS: ${{ inputs.rebuild_deps }}
          NARROW: ${{ vars.MESH_FULLDEP_NARROW }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$FORCE" != true && "$REBUILD_DEPS" != true && -f .k1-last-success ]]; then
            previous=$(cat .k1-last-success)
            if git cat-file -e "$previous^{commit}" 2>/dev/null; then
              if [[ -z $(git diff --name-only "$previous" HEAD -- schema/ mesh/ core/ geometry/ io/ tools/samples/ CMakeLists.txt cmake/ tests/ .github/workflows/nightly-mesh-fulldep.yml) ]]; then
                run=false
              fi
            fi
          fi
          # Optional Tue/Fri narrowing (Beijing). UTC 18:00 Mon/Thu = 02:00 Tue/Fri CST.
          # vars.MESH_FULLDEP_NARROW defaults to off when the repository variable is unset.
          if [[ "$run" == true && "$NARROW" == true && "$FORCE" != true && "$REBUILD_DEPS" != true ]]; then
            dow=$(date -u +%u)
            deps_changed=false
            if [[ -f .k1-last-success ]]; then
              previous=$(cat .k1-last-success)
              if git cat-file -e "$previous^{commit}" 2>/dev/null; then
                if [[ -n $(git diff --name-only "$previous" HEAD -- tests/integration/mesh_p1/ci/deps.lock tests/integration/mesh_p1/ci/build_deps_cpu.sh tests/integration/mesh_p1/ci/write_manifest.sh) ]]; then
                  deps_changed=true
                fi
              fi
            fi
            if [[ "$deps_changed" != true && "$dow" != 1 && "$dow" != 4 ]]; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Full-dependency mesh run: $run"

      - name: Compiler identity
        id: compiler
        run: |
          set -euo pipefail
          # ImageOS is a runner env var; ${{ env.ImageOS }} is empty at parse time
          # unless a previous step writes it to GITHUB_ENV. Use the step output in keys.
          image_os="${ImageOS:-unknown}"
          compiler_id="$(g++ -dumpmachine)-gcc-$(g++ -dumpfullversion)"
          echo "id=$compiler_id" >> "$GITHUB_OUTPUT"
          echo "image_os=$image_os" >> "$GITHUB_OUTPUT"
          echo "ImageOS=$image_os" >> "$GITHUB_ENV"
          echo "Cache identity: image_os=$image_os compiler=$compiler_id"

      - name: Record run identity
        if: steps.changes.outputs.run == 'true'
        env:
          TESTED_SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          REBUILD_DEPS: ${{ inputs.rebuild_deps }}
          DEPS_CACHE_KEY: k1-deps-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('tests/integration/mesh_p1/ci/deps.lock', 'tests/integration/mesh_p1/ci/build_deps_cpu.sh', 'tests/integration/mesh_p1/ci/write_manifest.sh') }}
        run: |
          set -euo pipefail
          mkdir -p build-k1-full
          {
            echo "sha=$TESTED_SHA event=$EVENT force=$FORCE rebuild_deps=$REBUILD_DEPS"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT job=$GITHUB_JOB"
            echo "dependency cache key=$DEPS_CACHE_KEY"
          } | tee build-k1-full/run-context.log

      - name: Restore dependency prefix
        id: cache-deps
        if: ${{ inputs.rebuild_deps != true }}
        uses: actions/cache/restore@v4
        with:
          path: build-k1-deps/prefix
          key: k1-deps-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('tests/integration/mesh_p1/ci/deps.lock', 'tests/integration/mesh_p1/ci/build_deps_cpu.sh', 'tests/integration/mesh_p1/ci/write_manifest.sh') }}

      - name: Install build tools, MPI and shared OCCT
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ ccache libopenmpi-dev openmpi-bin libopenblas-dev curl python3-h5py python3-numpy
          # shellcheck source=tests/integration/mesh_p1/ci/deps.lock
          source tests/integration/mesh_p1/ci/deps.lock
          occt_pins=()
          for package in $SYSTEM_OCCT_PACKAGES; do
            occt_pins+=("$package=$SYSTEM_OCCT_VERSION")
          done
          sudo apt-get install -y "${occt_pins[@]}"
          for package in $SYSTEM_OCCT_PACKAGES; do
            observed=$(dpkg-query -W -f='${Version}' "$package")
            [[ "$observed" == "$SYSTEM_OCCT_VERSION" ]] || exit 1
            echo "System OCCT: $package $observed"
          done
          actual=$(dpkg-query -W -f='${Version}' "$SYSTEM_MPI_PACKAGE")
          if [[ "$actual" != "$SYSTEM_MPI_VERSION" ]]; then
            echo "System MPI mismatch: $SYSTEM_MPI_PACKAGE is $actual, deps.lock pins $SYSTEM_MPI_VERSION." >&2
            echo "Update tests/integration/mesh_p1/ci/deps.lock and rerun so the cache key changes." >&2
            exit 1
          fi
          echo "System MPI: $SYSTEM_MPI_PACKAGE $actual"

      - name: Restore ccache
        id: cache-ccache
        # Skip restore when rebuild_deps is set so a polluted ccache cannot taint a forced rebuild.
        if: steps.changes.outputs.run == 'true' && inputs.rebuild_deps != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-k1-fulldep-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'schema/**', 'mesh/**', 'core/**', 'tests/**', 'solvers/**', 'geometry/**', 'io/**', 'material/**', 'kernel/**', 'coupling/**', 'protocol/**') }}
          restore-keys: |
            ccache-k1-fulldep-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-
            ccache-k1-fulldep-

      - name: Decide whether to build dependencies
        id: deps
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          need=true
          delete_bad=false
          verify=skipped
          if [[ "${{ inputs.rebuild_deps }}" == "true" ]]; then
            need=true
            delete_bad=true
            verify=rebuild_deps
          elif [[ "${{ steps.cache-deps.outputs.cache-hit }}" == "true" ]]; then
            if tests/integration/mesh_p1/ci/build_deps_cpu.sh --verify-only build-k1-deps/prefix; then
              need=false
              verify=passed
            else
              echo "Restored prefix failed verification; discarding."
              rm -rf build-k1-deps/prefix
              delete_bad=true
              need=true
              verify=failed
            fi
          else
            verify=cache_miss
          fi
          echo "need_build=$need" >> "$GITHUB_OUTPUT"
          echo "delete_bad_cache=$delete_bad" >> "$GITHUB_OUTPUT"
          echo "verify=$verify" >> "$GITHUB_OUTPUT"

      - name: Delete stale or corrupt dependency cache
        id: cache-delete
        if: steps.changes.outputs.run == 'true' && steps.deps.outputs.delete_bad_cache == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="k1-deps-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('tests/integration/mesh_p1/ci/deps.lock', 'tests/integration/mesh_p1/ci/build_deps_cpu.sh', 'tests/integration/mesh_p1/ci/write_manifest.sh') }}"
          delete_ok=true
          # gh cache delete takes a positional id or key, not --key (that flag is only on cache list).
          ids=$(gh cache list --key "$key" --json id --jq '.[].id' || true)
          if [[ -z "${ids}" ]]; then
            echo "No existing cache entry for $key"
          else
            for id in $ids; do
              if gh cache delete "$id"; then
                echo "Deleted cache id $id for $key"
              else
                echo "Failed to delete cache id $id for $key. Will rebuild and test, but will not save a new prefix." >&2
                delete_ok=false
              fi
            done
          fi
          echo "delete_ok=$delete_ok" >> "$GITHUB_OUTPUT"

      - name: Build dependencies
        id: build-deps
        if: steps.changes.outputs.run == 'true' && steps.deps.outputs.need_build == 'true'
        run: |
          set -euo pipefail
          start=$SECONDS
          tests/integration/mesh_p1/ci/build_deps_cpu.sh
          tests/integration/mesh_p1/ci/build_deps_cpu.sh --verify-only build-k1-deps/prefix
          echo "secs=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          echo "Dependency build and verify wall time: $((SECONDS - start))s"

      - name: Test PETSc MFEM acceptance guards
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile
          import textwrap
          import unittest

          repo = Path.cwd()
          ci = Path("tests/integration/mesh_p1/ci")
          workflow = (repo / ".github/workflows/nightly-mesh-fulldep.yml").read_text()

          def run(*args, cwd=None, env=None):
              # Use the real tools on PATH, including the shared build-slot wrappers.
              return subprocess.run(args, cwd=cwd, env=env, text=True, capture_output=True)

          def output(result):
              return result.stdout + result.stderr

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          class ProvenanceAcceptance(unittest.TestCase):
              def setUp(self):
                  temp = tempfile.TemporaryDirectory()
                  self.addCleanup(temp.cleanup)
                  self.root = Path(temp.name)
                  self.prefix = self.root / "build-k1-deps/prefix"
                  self.relative = "lib/cmake/mfem/MFEMConfig.cmake"
                  self.config = self.prefix / self.relative
                  self.config.parent.mkdir(parents=True)
                  self.config.write_text("# installed package fixture\n")
                  self.manifest = self.prefix / ".k1-manifest"
                  self.log = self.root / "build-k1-full/configure.log"
                  self.log.parent.mkdir()
                  self.fields = [
                      ("install_prefix", str(self.prefix)),
                      ("mfem_config_relpath", self.relative),
                  ]
                  self.write_manifest()
                  self.write_log()

              def write_manifest(self):
                  self.manifest.write_text("".join(f"{key}={value}\n" for key, value in self.fields))

              def write_log(self, path=None, capability="ON"):
                  self.log.write_text(
                      "-- unrelated configure output\n"
                      f"-- MFEM_CONFIG={path or self.config}\n"
                      f"-- MFEM_USE_PETSC={capability}\n"
                      "-- Configuring done\n-- Generating done\n"
                  )

              def checker(self):
                  # Execute the production step; never duplicate its path/boolean logic here.
                  marker = "      - name: Validate MFEM provenance\n"
                  self.assertTrue(marker in workflow, "Missing post-configure MFEM provenance guard")
                  step = workflow.split(marker, 1)[1].split("\n      - ", 1)[0]
                  self.assertIn("        run: |\n", step)
                  shell = textwrap.dedent(step.split("        run: |\n", 1)[1])
                  return run("bash", "-c", shell, cwd=self.root)

              def test_matching_paths_and_cmake_true_values_pass(self):
                  for value in ("ON", "on", "TRUE", "Yes", "Y", "1", "2", "-1", "0.5", "enabled"):
                      with self.subTest(capability=value):
                          self.write_log(capability=value)
                          result = self.checker()
                          self.assertEqual(result.returncode, 0, output(result))
                          for expected in (str(self.prefix.resolve()), str(self.config.resolve()), value):
                              self.assertIn(expected, output(result))

              def test_equivalent_prefix_symlink_spelling_passes(self):
                  alias = self.root / "prefix-alias"
                  alias.symlink_to(self.prefix, target_is_directory=True)
                  self.fields[0] = ("install_prefix", str(alias))
                  self.write_manifest()
                  self.write_log(path=alias / self.relative)
                  result = self.checker()
                  self.assertEqual(result.returncode, 0, output(result))
                  self.assertIn(str(self.prefix.resolve()), output(result))
                  self.assertIn(str(self.config.resolve()), output(result))

              def test_missing_empty_and_duplicate_manifest_fields_fail(self):
                  valid = list(self.fields)
                  for key, _ in valid:
                      for mutation in ("missing", "empty", "duplicate", "conflicting-duplicate"):
                          with self.subTest(key=key, mutation=mutation):
                              self.fields = [(k, v) for k, v in valid if k != key]
                              if mutation == "empty":
                                  self.fields.append((key, ""))
                              elif "duplicate" in mutation:
                                  self.fields = valid + [(key, dict(valid)[key] if mutation == "duplicate" else "wrong")]
                              self.write_manifest()
                              result = self.checker()
                              self.assertNotEqual(result.returncode, 0, output(result))

              def test_missing_manifest_configure_log_and_config_fail(self):
                  for path in (self.manifest, self.log, self.config):
                      with self.subTest(path=path.name):
                          saved = path.read_bytes()
                          path.unlink()
                          result = self.checker()
                          self.assertNotEqual(result.returncode, 0, output(result))
                          path.write_bytes(saved)

              def test_false_and_undefined_capabilities_fail(self):
                  for value in ("", "OFF", "False", "NO", "N", "0", "IGNORE", "NOTFOUND", "MFEM-NOTFOUND"):
                      with self.subTest(capability=value):
                          self.write_log(capability=value)
                          result = self.checker()
                          self.assertNotEqual(result.returncode, 0, output(result))
                  self.write_log()
                  self.log.write_text(self.log.read_text().replace("-- MFEM_USE_PETSC=ON\n", ""))
                  result = self.checker()
                  self.assertNotEqual(result.returncode, 0, output(result))

              def test_missing_empty_and_duplicate_discovery_records_fail(self):
                  for key in ("MFEM_CONFIG", "MFEM_USE_PETSC"):
                      for mutation in ("missing", "empty", "duplicate", "conflicting-duplicate"):
                          with self.subTest(key=key, mutation=mutation):
                              self.write_log()
                              rows = self.log.read_text().splitlines()
                              record = next(row for row in rows if row.startswith("-- " + key + "="))
                              if mutation == "missing":
                                  rows.remove(record)
                              elif mutation == "empty":
                                  rows[rows.index(record)] = "-- " + key + "="
                              else:
                                  rows.append(record if mutation == "duplicate" else "-- " + key + "=wrong")
                              self.log.write_text("\n".join(rows) + "\n")
                              result = self.checker()
                              self.assertNotEqual(result.returncode, 0, output(result))

              def test_another_existing_mfem_installation_fails(self):
                  other = self.root / "other" / self.relative
                  other.parent.mkdir(parents=True)
                  other.write_text(self.config.read_text())
                  self.write_log(path=other)
                  result = self.checker()
                  self.assertNotEqual(result.returncode, 0, output(result))
                  for path in (self.prefix, self.config, other):
                      self.assertIn(str(path.resolve()), output(result))
                  self.assertRegex(output(result).lower(), r"false|fail|mismatch")

              def test_missing_install_prefix_directory_fails(self):
                  self.fields[0] = ("install_prefix", str(self.root / "absent-prefix"))
                  self.write_manifest()
                  result = self.checker()
                  self.assertNotEqual(result.returncode, 0, output(result))

              def test_absolute_and_parent_components_fail_even_when_the_file_matches(self):
                  for relative in (str(self.config), "lib/../" + self.relative, "../prefix/" + self.relative):
                      with self.subTest(relative=relative):
                          self.fields[1] = ("mfem_config_relpath", relative)
                          self.write_manifest()
                          result = self.checker()
                          self.assertNotEqual(result.returncode, 0, output(result))

              def test_symlink_escape_fails_even_when_discovered_and_expected_files_match(self):
                  outside = self.root / "outside-MFEMConfig.cmake"
                  outside.write_text(self.config.read_text())
                  self.config.unlink()
                  self.config.symlink_to(outside)
                  self.write_log(path=outside)
                  result = self.checker()
                  self.assertNotEqual(result.returncode, 0, output(result))

              def test_normalized_config_with_wrong_relative_suffix_fails(self):
                  # E == D and E is inside P, but removing the declared suffix from D
                  # would infer P/lib rather than P. This catches an omitted third comparison.
                  (self.prefix / "cmake").symlink_to("lib/cmake", target_is_directory=True)
                  self.fields[1] = ("mfem_config_relpath", "cmake/mfem/MFEMConfig.cmake")
                  self.write_manifest()
                  result = self.checker()
                  self.assertNotEqual(result.returncode, 0, output(result))

          class DiscoveryAcceptance(unittest.TestCase):
              def test_config_mode_wins_over_a_conflicting_find_module_and_reports_exports(self):
                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)
                      package = root / "prefix/lib/cmake/mfem"
                      package.mkdir(parents=True)
                      config = package / "MFEMConfig.cmake"
                      module = root / "modules"
                      module.mkdir()
                      (module / "FindMFEM.cmake").write_text('set(loaded "module")\nset(MFEM_FOUND TRUE)\n')
                      for value in ("ON", "OFF"):
                          with self.subTest(exported_capability=value):
                              config.write_text(f'set(loaded "config")\nset(MFEM_USE_PETSC {value})\n')
                              (root / "CMakeLists.txt").write_text(
                                  'cmake_minimum_required(VERSION 3.20)\nproject(discovery NONE)\n'
                                  f'set(CMAKE_MODULE_PATH "{module.as_posix()}")\n'
                                  'set(CHIPCAE_ENABLE_MFEM ON)\n'
                                  f'include("{(repo / "cmake/ChipcaeDependencies.cmake").as_posix()}")\n'
                                  'file(WRITE "${CMAKE_BINARY_DIR}/selected" "${loaded}")\n'
                              )
                              build = root / ("build-" + value)
                              result = run("cmake", "-S", str(root), "-B", str(build),
                                           "-DCMAKE_BUILD_TYPE=Release", f"-DCMAKE_PREFIX_PATH={root / 'prefix'}")
                              self.assertEqual(result.returncode, 0, output(result))
                              self.assertEqual((build / "selected").read_text(), "config",
                                               "MFEM module discovery selected a different installation")
                              self.assertIn(f"MFEM_CONFIG={config}", output(result))
                              self.assertIn(f"MFEM_USE_PETSC={value}", output(result))

              def test_all_optional_dependencies_remain_gated(self):
                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)
                      (root / "CMakeLists.txt").write_text(
                          'cmake_minimum_required(VERSION 3.20)\nproject(bare NONE)\n'
                          f'include("{(repo / "cmake/ChipcaeDependencies.cmake").as_posix()}")\n'
                      )
                      result = run("cmake", "-S", str(root), "-B", str(root / "build"),
                                   "-DCMAKE_BUILD_TYPE=Release")
                      self.assertEqual(result.returncode, 0, output(result))

              def test_discovered_config_and_exported_capability_are_reported_without_input_substitution(self):
                  with tempfile.TemporaryDirectory() as temp:
                      root = Path(temp)
                      package = root / "prefix/lib/cmake/mfem"
                      package.mkdir(parents=True)
                      config = package / "MFEMConfig.cmake"
                      for value in ("ON", "OFF"):
                          with self.subTest(exported_capability=value):
                              config.write_text(f"set(MFEM_USE_PETSC {value})\n")
                              (root / "CMakeLists.txt").write_text(
                                  'cmake_minimum_required(VERSION 3.20)\nproject(diagnostics NONE)\n'
                                  'set(CHIPCAE_ENABLE_MFEM ON)\n'
                                  f'include("{(repo / "cmake/ChipcaeDependencies.cmake").as_posix()}")\n'
                              )
                              result = run("cmake", "-S", str(root), "-B", str(root / ("build-" + value)),
                                           "-DCMAKE_BUILD_TYPE=Release", f"-DCMAKE_PREFIX_PATH={root / 'prefix'}")
                              self.assertEqual(result.returncode, 0, output(result))
                              with self.subTest(record="config"):
                                  self.assertIn(f"MFEM_CONFIG={config}", output(result))
                              with self.subTest(record="capability"):
                                  self.assertIn(f"MFEM_USE_PETSC={value}", output(result))

          class PrefixFixture(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  temp = tempfile.TemporaryDirectory()
                  cls.addClassCleanup(temp.cleanup)
                  cls.fixture = Path(temp.name)
                  source = cls.fixture / "source"
                  source.mkdir()
                  # Small real compiled libraries keep the new MFEM consumer's link
                  # validation real. They are synthetic, not substitutes for runner acceptance.
                  (source / "petsc.cpp").write_text(
                      'extern "C" int PetscInitialize(int*, char***, const char*, const char*) { return 0; }\n'
                      'extern "C" int PetscFinalize() { return 0; }\n'
                  )
                  (source / "petsc.h").write_text(
                      '#pragma once\nextern "C" {\n'
                      'int PetscInitialize(int*, char***, const char*, const char*);\n'
                      'int PetscFinalize();\n}\n'
                  )
                  (source / "mfem.cpp").write_text('int fixture_mfem() { return 0; }\n')
                  (source / "mfem.hpp").write_text(
                      '#pragma once\n#include <petsc.h>\nnamespace mfem { class PetscParMatrix {}; }\n'
                  )
                  (source / "MFEMConfig.cmake").write_text(
                      'set(MFEM_USE_PETSC ON)\ninclude("${CMAKE_CURRENT_LIST_DIR}/MFEMTargets.cmake")\n'
                  )
                  (source / "CMakeLists.txt").write_text(
                      'cmake_minimum_required(VERSION 3.20)\nproject(prefix_fixture LANGUAGES CXX)\n'
                      'add_library(petsc SHARED petsc.cpp)\nadd_library(mfem STATIC mfem.cpp)\n'
                      'target_link_libraries(mfem PUBLIC petsc)\n'
                      'target_include_directories(mfem INTERFACE "$<INSTALL_INTERFACE:include>")\n'
                      'install(TARGETS petsc mfem EXPORT MFEMTargets LIBRARY DESTINATION lib ARCHIVE DESTINATION lib)\n'
                      'install(EXPORT MFEMTargets DESTINATION lib/cmake/mfem)\n'
                      'install(FILES MFEMConfig.cmake DESTINATION lib/cmake/mfem)\n'
                      'install(FILES petsc.h mfem.hpp DESTINATION include)\n'
                  )
                  for args in (
                      ("cmake", "-S", str(source), "-B", str(cls.fixture / "build"), "-G", "Ninja",
                       "-DCMAKE_BUILD_TYPE=Release", f"-DCMAKE_INSTALL_PREFIX={cls.fixture / 'installed'}",
                       "-DCMAKE_CXX_COMPILER_LAUNCHER="),
                      ("cmake", "--build", str(cls.fixture / "build"), "--parallel", "2"),
                      ("cmake", "--install", str(cls.fixture / "build")),
                  ):
                      result = run(*args)
                      if result.returncode:
                          raise AssertionError("Synthetic library fixture failed: " + output(result))

              def setUp(self):
                  temp = tempfile.TemporaryDirectory()
                  self.addCleanup(temp.cleanup)
                  self.root = Path(temp.name)
                  self.here = self.root / ci
                  shutil.copytree(repo / ci, self.here)
                  self.prefix = self.root / "build-k1-deps/prefix"
                  shutil.copytree(self.fixture / "installed", self.prefix)
                  self.config = self.prefix / "lib/cmake/mfem/MFEMConfig.cmake"
                  lock = self.here / "deps.lock"
                  # A rebuild may only use local fixtures; a missing archive fails promptly.
                  lock.write_text(re.sub(r"(?m)^([A-Z0-9_]+_URL)=.*$",
                                         rf"\1=file://{self.root}/missing-archive.tar.gz", lock.read_text()))
                  if not re.search(r"(?m)^PETSC_VERSION=", lock.read_text()):
                      with lock.open("a") as stream:
