name: Nightly mesh full dependencies
on:
  schedule:
    - cron: '0 18 * * 0-4'
  workflow_dispatch:
    inputs:
      force:
        description: Force tests even when schema/mesh/deps are unchanged
        type: boolean
        default: true
      rebuild_deps:
        description: Discard the dependency prefix cache, rebuild, and replace the cache entry
        type: boolean
        default: false
permissions:
  contents: read
  actions: write
concurrency:
  group: nightly-mesh-fulldep-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mesh-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      OMPI_MCA_rmaps_base_oversubscribe: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache/restore@v4
        with:
          path: .k1-last-success
          key: k1-success-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            k1-success-${{ github.ref_name }}-

      - name: Check changes since this job last succeeded
        id: changes
        env:
          FORCE: ${{ inputs.force }}
          REBUILD_DEPS: ${{ inputs.rebuild_deps }}
          NARROW: ${{ vars.MESH_FULLDEP_NARROW }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$FORCE" != true && "$REBUILD_DEPS" != true && -f .k1-last-success ]]; then
            previous=$(cat .k1-last-success)
            if git cat-file -e "$previous^{commit}" 2>/dev/null; then
              if [[ -z $(git diff --name-only "$previous" HEAD -- schema/ mesh/ core/ geometry/ io/ tools/samples/ CMakeLists.txt cmake/ tests/ .github/workflows/nightly-mesh-fulldep.yml) ]]; then
                run=false
              fi
            fi
          fi
          # Optional Tue/Fri narrowing (Beijing). UTC 18:00 Mon/Thu = 02:00 Tue/Fri CST.
          # vars.MESH_FULLDEP_NARROW defaults to off when the repository variable is unset.
          if [[ "$run" == true && "$NARROW" == true && "$FORCE" != true && "$REBUILD_DEPS" != true ]]; then
            dow=$(date -u +%u)
            deps_changed=false
            if [[ -f .k1-last-success ]]; then
              previous=$(cat .k1-last-success)
              if git cat-file -e "$previous^{commit}" 2>/dev/null; then
                if [[ -n $(git diff --name-only "$previous" HEAD -- tests/integration/mesh_p1/ci/deps.lock tests/integration/mesh_p1/ci/build_deps_cpu.sh) ]]; then
                  deps_changed=true
                fi
              fi
            fi
            if [[ "$deps_changed" != true && "$dow" != 1 && "$dow" != 4 ]]; then
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Full-dependency mesh run: $run"

      - name: Compiler identity
        id: compiler
        run: |
          set -euo pipefail
          # ImageOS is a runner env var; ${{ env.ImageOS }} is empty at parse time
          # unless a previous step writes it to GITHUB_ENV. Use the step output in keys.
          image_os="${ImageOS:-unknown}"
          compiler_id="$(g++ -dumpmachine)-gcc-$(g++ -dumpfullversion)"
          echo "id=$compiler_id" >> "$GITHUB_OUTPUT"
          echo "image_os=$image_os" >> "$GITHUB_OUTPUT"
          echo "ImageOS=$image_os" >> "$GITHUB_ENV"
          echo "Cache identity: image_os=$image_os compiler=$compiler_id"

      - name: Restore dependency prefix
        id: cache-deps
        if: ${{ inputs.rebuild_deps != true }}
        uses: actions/cache/restore@v4
        with:
          path: build-k1-deps/prefix
          key: k1-deps-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('tests/integration/mesh_p1/ci/deps.lock', 'tests/integration/mesh_p1/ci/build_deps_cpu.sh') }}

      - name: Install build tools, MPI and shared OCCT
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++ ccache libopenmpi-dev openmpi-bin curl python3-h5py python3-numpy
          # shellcheck source=tests/integration/mesh_p1/ci/deps.lock
          source tests/integration/mesh_p1/ci/deps.lock
          occt_pins=()
          for package in $SYSTEM_OCCT_PACKAGES; do
            occt_pins+=("$package=$SYSTEM_OCCT_VERSION")
          done
          sudo apt-get install -y "${occt_pins[@]}"
          for package in $SYSTEM_OCCT_PACKAGES; do
            observed=$(dpkg-query -W -f='${Version}' "$package")
            [[ "$observed" == "$SYSTEM_OCCT_VERSION" ]] || exit 1
            echo "System OCCT: $package $observed"
          done
          actual=$(dpkg-query -W -f='${Version}' "$SYSTEM_MPI_PACKAGE")
          if [[ "$actual" != "$SYSTEM_MPI_VERSION" ]]; then
            echo "System MPI mismatch: $SYSTEM_MPI_PACKAGE is $actual, deps.lock pins $SYSTEM_MPI_VERSION." >&2
            echo "Update tests/integration/mesh_p1/ci/deps.lock and rerun so the cache key changes." >&2
            exit 1
          fi
          echo "System MPI: $SYSTEM_MPI_PACKAGE $actual"

      - name: Restore ccache
        id: cache-ccache
        # Skip restore when rebuild_deps is set so a polluted ccache cannot taint a forced rebuild.
        if: steps.changes.outputs.run == 'true' && inputs.rebuild_deps != true
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-k1-fulldep-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'schema/**', 'mesh/**', 'core/**', 'tests/**', 'solvers/**', 'geometry/**', 'io/**', 'material/**', 'kernel/**', 'coupling/**', 'protocol/**') }}
          restore-keys: |
            ccache-k1-fulldep-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-
            ccache-k1-fulldep-

      - name: Decide whether to build dependencies
        id: deps
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          need=true
          delete_bad=false
          verify=skipped
          if [[ "${{ inputs.rebuild_deps }}" == "true" ]]; then
            need=true
            delete_bad=true
            verify=rebuild_deps
          elif [[ "${{ steps.cache-deps.outputs.cache-hit }}" == "true" ]]; then
            if tests/integration/mesh_p1/ci/verify_prefix.sh build-k1-deps/prefix; then
              need=false
              verify=passed
            else
              echo "Restored prefix failed verification; discarding."
              rm -rf build-k1-deps/prefix
              delete_bad=true
              need=true
              verify=failed
            fi
          else
            verify=cache_miss
          fi
          echo "need_build=$need" >> "$GITHUB_OUTPUT"
          echo "delete_bad_cache=$delete_bad" >> "$GITHUB_OUTPUT"
          echo "verify=$verify" >> "$GITHUB_OUTPUT"

      - name: Delete stale or corrupt dependency cache
        id: cache-delete
        if: steps.changes.outputs.run == 'true' && steps.deps.outputs.delete_bad_cache == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          key="k1-deps-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('tests/integration/mesh_p1/ci/deps.lock', 'tests/integration/mesh_p1/ci/build_deps_cpu.sh') }}"
          delete_ok=true
          # gh cache delete takes a positional id or key, not --key (that flag is only on cache list).
          ids=$(gh cache list --key "$key" --json id --jq '.[].id' || true)
          if [[ -z "${ids}" ]]; then
            echo "No existing cache entry for $key"
          else
            for id in $ids; do
              if gh cache delete "$id"; then
                echo "Deleted cache id $id for $key"
              else
                echo "Failed to delete cache id $id for $key. Will rebuild and test, but will not save a new prefix." >&2
                delete_ok=false
              fi
            done
          fi
          echo "delete_ok=$delete_ok" >> "$GITHUB_OUTPUT"

      - name: Build dependencies
        id: build-deps
        if: steps.changes.outputs.run == 'true' && steps.deps.outputs.need_build == 'true'
        run: |
          set -euo pipefail
          start=$SECONDS
          tests/integration/mesh_p1/ci/build_deps_cpu.sh
          tests/integration/mesh_p1/ci/verify_prefix.sh build-k1-deps/prefix
          echo "secs=$((SECONDS - start))" >> "$GITHUB_OUTPUT"
          echo "Dependency build and verify wall time: $((SECONDS - start))s"

      - name: Test N11 acceptance guards
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path
          import re
          import shlex
          import subprocess
          import sys
          import tempfile
          import textwrap
          import unittest
          import xml.etree.ElementTree as ET

          workflow = Path(".github/workflows/nightly-mesh-fulldep.yml").read_text()
          step = workflow.split("      - name: Build project and run mesh tests\n", 1)[1]
          shell = textwrap.dedent(step.split("        run: |\n", 1)[1].split("      - uses:", 1)[0])
          scripts = re.findall(r"python3[^\n]* <<'PY'\n(.*?)\nPY", shell, re.S)
          names = (
              "import_assembly_accept", "import_assembly_accept_default",
              "import_assembly_exit6", "import_assembly_split_report",
              "occt_import_assembly_box_parts", "occt_import_assembly_confirm",
              "occt_import_assembly_ring_chamfer_lid", "occt_import_assembly_parts_from_step",
              "reportfields_step_box_a1",
          )

          class N11Acceptance(unittest.TestCase):
              def setUp(self):
                  temp = tempfile.TemporaryDirectory()
                  self.addCleanup(temp.cleanup)
                  self.root = Path(temp.name)
                  build = self.root / "build-k1-full"
                  (build / "import-assets").mkdir(parents=True)
                  self.capability = build / "import-assets/assembly-capabilities.json"
                  self.report = build / "n11-geometry-on.xml"

              def checker(self, index, selected=names):
                  self.assertEqual(len(scripts), 2, "Both inline N11 guards must be present")
                  return subprocess.run(
                      [sys.executable, "-c", scripts[index], *selected],
                      cwd=self.root, text=True, capture_output=True,
                  )

              def passed_suite(self):
                  suite = ET.Element("testsuite", tests="9", failures="0", skipped="0")
                  for name in names:
                      ET.SubElement(suite, "testcase", name=name, status="run", time="0.01")
                  return suite

              def write_suite(self, suite):
                  ET.ElementTree(suite).write(self.report)

              def assert_rejected(self, result):
                  self.assertNotEqual(result.returncode, 0, result.stdout + result.stderr)
                  self.assertNotIn("Passed=9, Skipped=0", result.stdout)

              def selector(self):
                  self.assertIn("n11_names=(", shell, "The dedicated N11 selector is required")
                  return shell[shell.index("n11_names=("):shell.index("n11_status=0")]

              def test_inline_shell_and_python_syntax(self):
                  result = subprocess.run(["bash", "-n"], input=shell, text=True, capture_output=True)
                  self.assertEqual(result.returncode, 0, result.stderr)
                  self.assertEqual(len(scripts), 2)
                  for script in scripts:
                      compile(script, "inline N11 guard", "exec")

              def test_configure_explicitly_enables_geometry_once(self):
                  command = re.search(r"^cmake -S .*?(?=\n[^ ])", shell, re.M | re.S).group()
                  args = shlex.split(command.replace("\\\n", " "))
                  for option in (
                      "-DCMAKE_BUILD_TYPE=Release", "-DCHIPCAE_ENABLE_ECAD=ON",
                      "-DCHIPCAE_ENABLE_OCCT=ON", "-DCHIPCAE_ENABLE_JSONCONS=ON",
                      "-DCHIPCAE_ASSEMBLY_GEOMETRY_AVAILABLE=ON",
                  ):
                      with self.subTest(option=option):
                          self.assertEqual(args.count(option), 1, f"Required configure argument: {option}")

              def test_selector_contains_exactly_the_nine_expected_names(self):
                  result = subprocess.run(
                      ["bash", "-c", "set -euo pipefail\n" + self.selector() + 'printf "%s" "$n11_regex"'],
                      text=True, capture_output=True,
                  )
                  self.assertEqual(result.returncode, 0, result.stderr)
                  self.assertEqual(result.stdout, "^(" + "|".join(names) + ")$")

              def test_existing_three_ctest_commands_are_preserved(self):
                  commands = [line for line in shell.splitlines() if line.startswith("ctest ")]
                  self.assertEqual(commands[:3], [
                      'ctest --test-dir build-k1-full -L "mesh|occt" -LE gpu --output-on-failure --output-junit mesh-results.xml',
                      "ctest --test-dir build-k1-full -R '^mesh_digest_mpi$' --no-tests=error --output-on-failure",
                      'ctest --test-dir build-k1-full -R "^vtkhdf_results_" --no-tests=error --output-on-failure',
                  ])

              def test_capability_accepts_only_the_exact_on_string(self):
                  for value in ("ON", "OFF", "on", True, False, None, 1):
                      with self.subTest(value=value):
                          raw = json.dumps({"geometry": value})
                          self.capability.write_text(raw)
                          result = self.checker(0)
                          self.assertIn(raw, result.stdout)
                          if value == "ON":
                              self.assertEqual(result.returncode, 0, result.stderr)
                          else:
                              self.assert_rejected(result)
                  for raw in ("{}", "{broken"):
                      with self.subTest(raw=raw):
                          self.capability.write_text(raw)
                          self.assert_rejected(self.checker(0))
                  self.capability.unlink()
                  self.assert_rejected(self.checker(0))

              def test_nine_unique_run_cases_print_names_status_times_and_success(self):
                  suite = self.passed_suite()
                  suite[:] = list(reversed(suite))
                  self.write_suite(suite)
                  result = self.checker(1)
                  self.assertEqual(result.returncode, 0, result.stderr)
                  self.assertIn("Passed=9, Skipped=0", result.stdout)
                  for name in names:
                      self.assertIn(f"{name}: status=run, time=0.01", result.stdout)

              def test_missing_duplicate_renamed_and_unexpected_cases_are_rejected(self):
                  for index, name in enumerate(names):
                      for mutation in ("missing", "duplicate", "renamed", "unexpected"):
                          with self.subTest(name=name, mutation=mutation):
                              suite = self.passed_suite()
                              if mutation == "missing":
                                  suite.remove(suite[index])
                              elif mutation == "duplicate":
                                  suite.append(copy.deepcopy(suite[index]))
                              elif mutation == "renamed":
                                  suite[index].set("name", "assembly_no_occt")
                              else:
                                  ET.SubElement(suite, "testcase", name="assembly_no_occt", status="run")
                              self.write_suite(suite)
                              self.assert_rejected(self.checker(1))
                  self.write_suite(ET.Element("testsuite"))
                  self.assert_rejected(self.checker(1))

              def test_junit_names_must_equal_the_selected_name_multiset(self):
                  self.write_suite(self.passed_suite())
                  for selected in (names[:-1], (*names, names[0]), (*names[:-1], "assembly_no_occt")):
                      with self.subTest(selected=selected):
                          self.assert_rejected(self.checker(1, selected))

              def test_skipped_failed_errored_disabled_and_not_run_cases_are_rejected(self):
                  for index, name in enumerate(names):
                      for mutation in (
                          "skipped", "failure", "error", "disabled", "notrun", "fail", "missing-status",
                      ):
                          with self.subTest(name=name, mutation=mutation):
                              suite = self.passed_suite()
                              if mutation in ("skipped", "failure", "error"):
                                  ET.SubElement(suite[index], mutation)
                              elif mutation == "missing-status":
                                  del suite[index].attrib["status"]
                              else:
                                  suite[index].set("status", mutation)
                              self.write_suite(suite)
                              self.assert_rejected(self.checker(1))

              def test_missing_and_malformed_junit_are_rejected(self):
                  self.assert_rejected(self.checker(1))
                  self.report.write_text("<testsuite")
                  self.assert_rejected(self.checker(1))

              def test_ctest_failure_is_propagated_after_inspecting_a_valid_report(self):
                  self.write_suite(self.passed_suite())
                  block = shell[shell.index("n11_status=0"):shell.index('echo "build_secs=')]
                  for status in (0, 19):
                      with self.subTest(status=status):
                          # Isolate CTest's process status; execute the real shell and JUnit guard.
                          setup = "set -euo pipefail\n" + self.selector()
                          setup += "ctest() { printf '%s\\0' \"$@\" > ctest-args; return " + str(status) + "; }\n"
                          result = subprocess.run(
                              ["bash", "-c", setup + block], cwd=self.root, text=True, capture_output=True,
                          )
                          self.assertIn("Passed=9, Skipped=0", result.stdout, result.stderr)
                          self.assertEqual(result.returncode, status, result.stderr)
                          self.assertEqual((self.root / "ctest-args").read_bytes().split(b"\0")[:-1], [
                              arg.encode() for arg in (
                                  "--test-dir", "build-k1-full", "-R", "^(" + "|".join(names) + ")$",
                                  "--no-tests=error", "--output-on-failure", "--output-junit", "n11-geometry-on.xml",
                              )
                          ])

          unittest.main(verbosity=2)
          PY

      - name: Build project and run mesh tests
        id: tests
        if: steps.changes.outputs.run == 'true'
        run: |
          set -euo pipefail
          start=$SECONDS
          cmake -S . -B build-k1-full -G Ninja -DCMAKE_BUILD_TYPE=Release -DCHIPCAE_WARNINGS_AS_ERRORS=ON -DCHIPCAE_RESULTS_FAULT_INJECTION=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH="$PWD/build-k1-deps/prefix" \
            -DCHIPCAE_ENABLE_MPI=ON -DCHIPCAE_ENABLE_MFEM=ON \
            -DCHIPCAE_ENABLE_HYPRE=ON -DCHIPCAE_ENABLE_HDF5=ON -DCHIPCAE_ENABLE_JSONCONS=ON \
            -DCHIPCAE_ENABLE_ECAD=ON -DCHIPCAE_ENABLE_OCCT=ON -DCHIPCAE_ASSEMBLY_GEOMETRY_AVAILABLE=ON -DPython3_EXECUTABLE=/usr/bin/python3 \
            -DCMAKE_DISABLE_FIND_PACKAGE_Clipper2=TRUE \
            -DCMAKE_DISABLE_FIND_PACKAGE_EXPAT=TRUE
          python3 - <<'PY'
          import json
          from pathlib import Path

          raw = Path("build-k1-full/import-assets/assembly-capabilities.json").read_text()
          print(raw, flush=True)
          if json.loads(raw).get("geometry") != "ON":
              raise SystemExit('N11 requires geometry == "ON"')
          PY
          cmake --build build-k1-full --parallel 2
          build_secs=$((SECONDS - start))
          test_start=$SECONDS
          ctest --test-dir build-k1-full -L "mesh|occt" -LE gpu --output-on-failure --output-junit mesh-results.xml
          ctest --test-dir build-k1-full -R '^mesh_digest_mpi$' --no-tests=error --output-on-failure
          ctest --test-dir build-k1-full -R "^vtkhdf_results_" --no-tests=error --output-on-failure
          n11_names=(
            import_assembly_accept import_assembly_accept_default
            import_assembly_exit6 import_assembly_split_report
            occt_import_assembly_box_parts occt_import_assembly_confirm
            occt_import_assembly_ring_chamfer_lid occt_import_assembly_parts_from_step
          )
          n11_regex="^($(IFS='|'; echo "${n11_names[*]}"))$"
          n11_status=0
          ctest --test-dir build-k1-full -R "$n11_regex" --no-tests=error --output-on-failure \
            --output-junit n11-geometry-on.xml || n11_status=$?
          python3 - "${n11_names[@]}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from collections import Counter

          required_names = {
              "import_assembly_accept", "import_assembly_accept_default",
              "import_assembly_exit6", "import_assembly_split_report",
              "occt_import_assembly_box_parts", "occt_import_assembly_confirm",
              "occt_import_assembly_ring_chamfer_lid", "occt_import_assembly_parts_from_step",
              "reportfields_step_box_a1",
          }
          cases = list(ET.parse("build-k1-full/n11-geometry-on.xml").getroot().iter("testcase"))
          for case in cases:
              print(f'{case.get("name")}: status={case.get("status")}, time={case.get("time")}',
                    flush=True)
          skipped = sum(1 for case in cases if case.find("skipped") is not None)
          if Counter(case.get("name") for case in cases) != Counter(required_names):
              raise SystemExit("N11 requires exactly nine unique expected testcases, "
                               "including reportfields_step_box_a1")
          if Counter(case.get("name") for case in cases) != Counter(sys.argv[1:]):
              raise SystemExit("N11 requires the selected names to match all nine testcases")
          if skipped != 0 or any(
              case.get("status") != "run"
              or any(case.find(tag) is not None for tag in ("skipped", "failure", "error"))
              for case in cases
          ):
              raise SystemExit(f"N11 requires all nine Passed, Skipped={skipped}")
          print("Passed=9, Skipped=0")
          PY
          if ((n11_status != 0)); then exit "$n11_status"; fi
          echo "build_secs=$build_secs" >> "$GITHUB_OUTPUT"
          echo "test_secs=$((SECONDS - test_start))" >> "$GITHUB_OUTPUT"
          echo "Project build ${build_secs}s, ctest $((SECONDS - test_start))s"

      - uses: actions/upload-artifact@v4
        if: always() && steps.changes.outputs.run == 'true'
        with:
          name: mesh-full-results
          path: |
            build-k1-full/mesh-results.xml
            build-k1-full/n11-geometry-on.xml
            build-k1-full/Testing/Temporary/LastTest.log

      - name: Fail if a cache key could not be replaced
        if: success() && steps.changes.outputs.run == 'true' && steps.deps.outputs.delete_bad_cache == 'true' && steps.cache-delete.outputs.delete_ok != 'true'
        run: |
          echo "Rebuilt the prefix, but could not delete the existing k1-deps cache key; not saved." >&2
          echo "Delete it by hand with: gh cache delete <cache-id>" >&2
          exit 1

      - name: Stamp successful tested SHA
        if: >-
          success()
          && steps.changes.outputs.run == 'true'
          && (steps.deps.outputs.delete_bad_cache != 'true'
              || steps.cache-delete.outputs.delete_ok == 'true')
        run: git rev-parse HEAD > .k1-last-success

      - uses: actions/cache/save@v4
        if: >-
          success()
          && steps.changes.outputs.run == 'true'
          && (steps.deps.outputs.delete_bad_cache != 'true'
              || steps.cache-delete.outputs.delete_ok == 'true')
        with:
          path: .k1-last-success
          key: k1-success-${{ github.ref_name }}-${{ github.run_id }}

      - name: Save dependency prefix
        if: >-
          success()
          && steps.changes.outputs.run == 'true'
          && steps.deps.outputs.need_build == 'true'
          && (steps.deps.outputs.delete_bad_cache != 'true'
              || steps.cache-delete.outputs.delete_ok == 'true')
        uses: actions/cache/save@v4
        with:
          path: build-k1-deps/prefix
          key: k1-deps-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('tests/integration/mesh_p1/ci/deps.lock', 'tests/integration/mesh_p1/ci/build_deps_cpu.sh') }}

      - name: Save ccache
        if: success() && steps.changes.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-k1-fulldep-${{ steps.compiler.outputs.image_os }}-${{ steps.compiler.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'schema/**', 'mesh/**', 'core/**', 'tests/**', 'solvers/**', 'geometry/**', 'io/**', 'material/**', 'kernel/**', 'coupling/**', 'protocol/**') }}

      - name: Report cache sizes
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Mesh full-dependency caches"
            echo
            echo "- tests run: \`${{ steps.changes.outputs.run || 'unknown' }}\`"
            echo "- rebuild_deps: \`${{ inputs.rebuild_deps || false }}\`"
            echo "- dependency cache-hit: \`${{ steps.cache-deps.outputs.cache-hit || 'false' }}\`"
            echo "- ccache cache-hit: \`${{ steps.cache-ccache.outputs.cache-hit || 'false' }}\`"
            echo "- verify: \`${{ steps.deps.outputs.verify || 'skipped' }}\`"
            echo "- need_build: \`${{ steps.deps.outputs.need_build || 'false' }}\`"
            echo "- dependency build seconds: \`${{ steps.build-deps.outputs.secs || 'n/a' }}\`"
            echo "- project build seconds: \`${{ steps.tests.outputs.build_secs || 'n/a' }}\`"
            echo "- ctest seconds: \`${{ steps.tests.outputs.test_secs || 'n/a' }}\`"
            if [[ -d build-k1-deps/prefix ]]; then
              echo "- prefix size: \`$(du -sh build-k1-deps/prefix | awk '{print $1}')\` (\`$(du -sb build-k1-deps/prefix | awk '{print $1}')\` bytes)"
            else
              echo "- prefix size: missing"
            fi
            if [[ -d .ccache ]]; then
              echo "- ccache size: \`$(du -sh .ccache | awk '{print $1}')\` (\`$(du -sb .ccache | awk '{print $1}')\` bytes)"
              ccache -s || true
            else
              echo "- ccache size: missing"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "::notice::deps cache-hit=${{ steps.cache-deps.outputs.cache-hit || 'false' }} need_build=${{ steps.deps.outputs.need_build || 'false' }} verify=${{ steps.deps.outputs.verify || 'skipped' }} ccache-hit=${{ steps.cache-ccache.outputs.cache-hit || 'false' }}"
