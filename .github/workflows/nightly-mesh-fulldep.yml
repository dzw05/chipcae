                                       "PETSC_SHA256=" + "a" * 64 + "\n")
                  self.pins = dict(re.findall(r"(?m)^([A-Z0-9_]+)=(.*)$", lock.read_text()))
                  for relative in (
                      "lib/libmetis.so", "lib/libHYPRE.a", "lib/libhdf5.so.310.5.1",
                      "lib/cmake/HYPRE/HYPREConfig.cmake", "cmake/hdf5-config.cmake",
                      "share/cmake/jsoncons/jsonconsConfig.cmake", "include/petscsys.h", "include/petscconf.h",
                  ):
