                  self.write_fixture_manifest()

              def write_fixture_manifest(self):
                  compiler = run("g++", "-dumpmachine").stdout.strip() + "-gcc-" + run("g++", "-dumpfullversion").stdout.strip()
                  fields = {
                      "format": "1", "compiler_id": compiler, "image_os": os.environ.get("ImageOS", "unknown"),
                      "install_prefix": str(self.prefix), "mfem_config_relpath": "lib/cmake/mfem/MFEMConfig.cmake",
                      "deps_lock_sha256": digest(self.here / "deps.lock"),
                      "build_script_sha256": digest(self.here / "build_deps_cpu.sh"),
                      "manifest_script_sha256": digest(self.here / "write_manifest.sh"),
                      **{key: value for key, value in self.pins.items()
                         if key.endswith("_VERSION") or key in ("SYSTEM_MPI_PACKAGE", "PETSC_URL", "PETSC_SHA256")},
                  }
                  rows = [f"{key}={value}\n" for key, value in fields.items()]
                  rows += [f"SHA256  {digest(path)}  {path.relative_to(self.prefix)}\n"
                           for path in sorted(self.prefix.rglob("*")) if path.is_file() and not path.name.startswith(".k1-")]
                  self.manifest.write_text("".join(rows))

              def install(self, *args):
                  return run("bash", str(self.here / "build_deps_cpu.sh"), *map(str, args),
                             cwd=self.root, env=self.env)

