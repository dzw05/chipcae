                  (self.here / "verify_prefix.sh").write_text(
                      '#!/usr/bin/env bash\nset -euo pipefail\nprintf "verified\\n" >> "$K1_LEGACY_VERIFY_TRACE"\n'
                  )
                  self.env = dict(os.environ, CMAKE_BUILD_PARALLEL_LEVEL="2",
                                  K1_LEGACY_VERIFY_TRACE=str(self.trace))
                  key = run("bash", "-c", "sha256sum build_deps_cpu.sh deps.lock | sha256sum | cut -d' ' -f1",
                            cwd=self.here)
                  self.assertEqual(key.returncode, 0, output(key))
