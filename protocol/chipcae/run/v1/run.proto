syntax = "proto3";

package chipcae.run.v1;

// Launch a simulation job from the desktop client or job manager.
message StartRunRequest {
  string run_id = 1;
  string case_uri = 2;
  map<string, string> parameters = 3;
}

message StartRunResponse {
  string run_id = 1;
}

message WatchRunRequest {
  string run_id = 1;
}

message RunProgress {
  string run_id = 1;
  string stage = 2;
  double fraction = 3;
  string message = 4;
}

service RunService {
  rpc StartRun(StartRunRequest) returns (StartRunResponse);
  rpc WatchRun(WatchRunRequest) returns (stream RunProgress);
}
