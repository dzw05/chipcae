# APPEND-ONLY. 已发布条目的 code/name 不得修改或删除；废弃用 deprecated: true。
# 新条目只能追加在末尾，code 单调递增。CI 会对比 main 分支版本校验。
# name 使用 UPPER_SNAKE（如 INTERNAL、DIVERGENCE_NAN_IN_FIELD）；code 为整数，只增不改。
schema_version: 1
errors:
  - {code: 1, name: INTERNAL, retryable: false, message: "Internal error"}
  - {code: 2, name: NOT_IMPLEMENTED, retryable: false, message: "Feature not implemented"}
  - {code: 3, name: COLUMN_SPLIT_ACROSS_RANKS, retryable: false, message: "Column spans multiple ranks"}
  - {code: 4, name: HIERARCHY_INVALID, retryable: false, message: "Column hierarchy is invalid"}
  - {code: 5, name: VERSION_UNSUPPORTED, retryable: false, message: "Protocol version is unsupported"}
  - {code: 6, name: IMPORT_CONFIRMATION_REQUIRED, retryable: false, message: "Import requires confirmation"}
  - {code: 7, name: IMPORT_REJECTED, retryable: false, message: "Import rejected"}
  - {code: 8, name: IMPORT_UNSUPPORTED_ELEMENT, retryable: false, message: "Import contains an unsupported element"}
  - {code: 9, name: MATERIAL_MAPPING_MISSING, retryable: false, message: "Material mapping is missing"}
